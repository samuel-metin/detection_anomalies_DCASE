# Auto-encodeur conditionné par l'ID de la machine (CAE, idée de Kapka, 2020) : l'AE de la baseline, dont le
# décodeur reçoit le code latent concaténé au one-hot de l'ID de la machine (id_04 -> 4).
# Un seul modèle pour toutes les machines du type.
model:
  name: cae
  input_shape: 640          # 5 trames log-mel de 128 bandes
  hidden_shapes: [128, 128, 128, 128]   # comme l'AE de la baseline
  latent_shape: 8
  n_ids: 8                  # ID possibles : 0 à 7 (pompe : 0, 2, 4, 6)

data:
  root: data/pump           # train/normal/ et val/normal/ (log-mel .npy), créés par prepare_data.py
  n_frames: 5               # trames concaténées par vecteur : 128 bandes x 5 = 640 = model.input_shape
  batch_size: 512
  shuffle: true
  with_ids: true            # batchs (vecteurs, ids) : ID de machine tiré du nom des fichiers

train:
  epochs: 100
  lr: 0.001

trainer:                    # arguments passés tels quels à lightning.pytorch.Trainer
  log_every_n_steps: 50     # fréquence des courbes "_step" dans TensorBoard
  check_val_every_n_epoch: 1

seed: 0
device: auto                # auto | cpu | cuda | cuda:0 ...
output_dir: outputs
