# Auto-encodeur à plus proche voisin (nnae) : l'AE de la baseline, dont le décodeur reçoit le code mélangé à
# celui du plus proche exemple normal de la même machine : z_mix = alpha * z + (1 - alpha) * z_voisin.
# Entraînement : voisin pris dans le batch, dans un autre son ; évaluation : dans une mémoire d'exemples du train.
model:
  name: nnae
  input_shape: 640          # 5 trames log-mel de 128 bandes
  hidden_shapes: [128, 128, 128, 128]   # comme l'AE de la baseline
  latent_shape: 8
  n_ids: 8                  # ID possibles : 0 à 7 (pompe : 0, 2, 4, 6), une mémoire par ID
  alpha: 0.5                # part du code du son ; 1 - alpha : part du code du voisin
  memory_size: 128          # codes en mémoire par machine (évaluation), ~ voisins possibles dans un batch

data:
  root: data/pump           # train/normal/ et val/normal/ (log-mel .npy), créés par prepare_data.py
  n_frames: 5               # trames concaténées par vecteur : 128 bandes x 5 = 640 = model.input_shape
  batch_size: 512
  shuffle: true
  with_ids: true            # ID de machine tiré du nom des fichiers (voisins de la même machine)
  with_sounds: true         # batchs (vecteurs, ids, sons) : voisins pris dans d'autres sons

train:
  epochs: 100
  lr: 0.001

trainer:                    # arguments passés tels quels à lightning.pytorch.Trainer
  log_every_n_steps: 50     # fréquence des courbes "_step" dans TensorBoard
  check_val_every_n_epoch: 1

seed: 0
device: auto                # auto | cpu | cuda | cuda:0 ...
output_dir: outputs
