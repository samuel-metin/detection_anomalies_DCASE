[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-anomalies"
version = "0.5.0"
description = "Détection de sons anormaux de machines (DCASE 2020 Task 2) par auto-encodeur avec PyTorch"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "lightning>=2.1",
    "tensorboard>=2.12",
    "pyyaml>=6.0",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["pandas>=1.5", "matplotlib>=3.6", "scikit-learn>=1.2", "ipykernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
